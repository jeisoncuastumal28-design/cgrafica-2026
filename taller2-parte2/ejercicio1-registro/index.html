<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 · Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">EJERCICIO 01</span>
          <h1>Crear cuenta</h1>
          <p>Registro con nombre, correo, contraseña y confirmación de términos.</p>
        </header>

        <form class="contact-form" action="#" method="post" novalidate>
          <div class="form-field">
            <label for="nombre">
              Nombre completo
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              autocomplete="name"
              placeholder="Ej. Laura Martínez"
              minlength="3"
              required
            >
          </div>

          <div class="form-field">
            <label for="email">
              Correo electrónico
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="nombre@dominio.com"
              required
            >
          </div>

          <div class="form-field">
            <label for="password">
              Contraseña
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              aria-describedby="password-help"
              required
            >
            <small id="password-help" class="field-help">Mínimo 8 caracteres.</small>
          </div>

          <div class="form-field">
            <label for="password2">
              Confirmar contraseña
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="password"
              id="password2"
              name="password2"
              minlength="8"
              autocomplete="new-password"
              required
            >
          </div>

          <label class="choice">
            <input type="checkbox" name="terminos" required>
            <span>Acepto los términos y condiciones y confirmo mi registro.</span>
          </label>

          <div class="form-actions">
            <button type="submit" class="button button-primary">Crear cuenta</button>
            <button type="reset" class="button button-secondary">Limpiar</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
