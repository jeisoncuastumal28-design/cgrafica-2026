<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 · Reserva</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">EJERCICIO 02</span>
          <h1>Reservar cita</h1>
          <p>Selecciona fecha, hora, número de personas y agrega comentarios.</p>
        </header>

        <form class="contact-form" action="#" method="post" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="fecha">
                Fecha
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input type="date" id="fecha" name="fecha" required>
            </div>
            <div class="form-field">
              <label for="hora">
                Hora
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input type="time" id="hora" name="hora" required>
            </div>
          </div>

          <div class="form-field">
            <label for="personas">
              Número de personas
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="number"
              id="personas"
              name="personas"
              min="1"
              max="20"
              step="1"
              value="1"
              aria-describedby="personas-help"
              required
            >
            <small id="personas-help" class="field-help">Entre 1 y 20 personas.</small>
          </div>

          <div class="form-field">
            <label for="comentarios">Comentarios</label>
            <textarea
              id="comentarios"
              name="comentarios"
              rows="5"
              maxlength="500"
              placeholder="Indicaciones especiales, alergias, ocasión, etc."
            ></textarea>
            <small class="field-help">Máximo 500 caracteres.</small>
          </div>

          <div class="form-actions">
            <button type="submit" class="button button-primary">Confirmar reserva</button>
            <button type="reset" class="button button-secondary">Limpiar</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
