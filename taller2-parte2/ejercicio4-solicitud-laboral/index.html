<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 · Solicitud laboral</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">EJERCICIO 04</span>
          <h1>Solicitud de empleo</h1>
          <p>Postúlate adjuntando tu hoja de vida.</p>
        </header>

        <form class="contact-form" action="#" method="post" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="nombre">
                Nombre completo
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input type="text" id="nombre" name="nombre" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="email">
                Correo electrónico
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
          </div>

          <div class="form-field">
            <label for="cargo">
              Cargo al que aplica
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <select id="cargo" name="cargo" required>
              <option value="" selected disabled>Seleccione un cargo</option>
              <option value="frontend">Desarrollador Frontend</option>
              <option value="backend">Desarrollador Backend</option>
              <option value="qa">Analista QA</option>
              <option value="soporte">Soporte Técnico</option>
            </select>
          </div>

          <div class="form-field">
            <label for="cv">
              Hoja de vida (CV)
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="file"
              id="cv"
              name="cv"
              accept=".pdf,.doc,.docx"
              aria-describedby="cv-help"
              required
            >
            <small id="cv-help" class="field-help">Formatos aceptados: PDF, DOC o DOCX.</small>
          </div>

          <div class="form-field">
            <label for="portafolio">Enlace a portafolio</label>
            <input type="url" id="portafolio" name="portafolio" placeholder="https://miportafolio.com">
          </div>

          <div class="form-actions">
            <button type="submit" class="button button-primary">Enviar postulación</button>
            <button type="reset" class="button button-secondary">Limpiar</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
